<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f6bff"/>
      <stop offset="1" stop-color="#8f5cf7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edff"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9edff"/>
    </linearGradient>
    <linearGradient id="rib" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#ff5d7a"/>
    </linearGradient>
  </defs>
  <!--BG-->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <!--ART-->
  <g>
    <!-- обложка (толщина книги) -->
    <path d="M256 214 C 216 186, 138 180, 78 202 L 78 392 C 138 372, 216 378, 256 408 Z" fill="#1a2373" fill-opacity="0.55"/>
    <path d="M256 214 C 296 186, 374 180, 434 202 L 434 392 C 374 372, 296 378, 256 408 Z" fill="#1a2373" fill-opacity="0.55"/>
    <!-- страницы -->
